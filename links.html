<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Dena Lancer - Link in Bio</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500&family=Poppins:wght@100;300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>

		<!-- Custom CSS -->
		<link rel="stylesheet" href="links.css" />
	</head>
	<body>
		<div class="header-top">
			<a href="coming-soon.html">
				<img
					class="logo-left"
					src="./images/mainImages/logoLancer.png"
					alt="The Lancer Method Logo"
				/>
			</a>
		</div>
		<hr class="top-divider" />

		<img
			src="./images/links/leftPic.png"
			alt="Sticky Notes"
			class="corner-img left-img"
		/>
		<img
			src="./images/links/rightPic.png"
			alt="Stairs"
			class="corner-img right-img"
		/>

		<div class="typing-text-container">
			<span class="typing-text" id="typing"></span>
		</div>
		<a href="coming-soon.html">
			<img
				class="avatar"
				src="./images/links/dena.jpg"
				alt="Dena Lancer Photo"
			/>
		</a>
		<h1>Dena Lancer</h1>
		<p class="subtitle">Founder of The Lancer Method | Strategist</p>

		<div class="button-group">
			<a href="coming-soon.html" class="btn primary uppercase btn-consult">
				BOOK YOUR FREE CONSULTATION
				<img
					src="./images/links/Schedule.png"
					alt="Schedule Icon"
					class="btn-icon-img"
				/>
			</a>
			<a href="coming-soon.html" class="btn secondary">
				Visit The Lancer Method Website
			</a>
			<a href="https://facebook.com" class="btn btn-outline btn-social">
				Facebook
				<img
					src="./images/links/FacebookIcon.png"
					alt="Facebook Icon"
					class="btn-icon-img"
				/>
			</a>
			<a href="https://tiktok.com" class="btn btn-outline btn-social">
				TikTok
				<img
					src="./images/links/TikTokIcon.png"
					alt="TikTok Icon"
					class="btn-icon-img"
				/>
			</a>
			<a href="https://linkedin.com" class="btn btn-outline btn-social">
				LinkedIn
				<img
					src="./images/links/LinkedInIcon.png"
					alt="LinkedIn Icon"
					class="btn-icon-img"
				/>
			</a>
			<a href="https://instagram.com" class="btn btn-outline btn-social">
				Instagram
				<img
					src="./images/links/InstagramIcon.png"
					alt="Instagram Icon"
					class="btn-icon-img"
				/>
			</a>
		</div>

		<script src="links.js"></script>
	</body>
</html>
